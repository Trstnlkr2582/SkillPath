name: Deploy — Merge & Build APK

on:
  workflow_dispatch:   # ← Se activa manualmente con un botón en GitHub

jobs:
  promote-to-production:
    name: 🚀 Promote to Production
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.changelog.outputs.VERSION }}
      notes: ${{ steps.changelog.outputs.RELEASE_NOTES }}
      date: ${{ steps.changelog.outputs.RELEASE_DATE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Parse CHANGELOG
        id: changelog
        run: node scripts/parse-changelog.js

      - name: Merge dev → main
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout main
          git merge origin/dev --no-ff --allow-unrelated-histories -m "chore: release v${{ steps.changelog.outputs.VERSION }} [ci skip]"
          git push origin main

  build-apk:
    name: 📦 Build APK v${{ needs.promote-to-production.outputs.version }}
    needs: promote-to-production
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.promote-to-production.outputs.version }}
      RELEASE_NOTES: ${{ needs.promote-to-production.outputs.notes }}
      RELEASE_DATE: ${{ needs.promote-to-production.outputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build APK
        run: |
          eas build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --output ./build/SkillPath-v${{ env.APP_VERSION }}.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkillPath-v${{ env.APP_VERSION }}-${{ env.RELEASE_DATE }}
          path: ./build/SkillPath-v${{ env.APP_VERSION }}.apk
          retention-days: 30
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "SkillPath v${{ env.APP_VERSION }} — ${{ env.RELEASE_DATE }}"
          body: ${{ env.RELEASE_NOTES }}
          files: ./build/SkillPath-v${{ env.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}